name: Push modules to subrepo

on:
  push:
    branches:
      - main
    paths:
      - "infra/modules/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
      
jobs:
  get-modified-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            fetch-depth: 2 # Ensure we have enough history for the diff

      - name: Get modified modules
        id: get-modules
        run: |
          folders_list=$(git diff --no-commit-id --name-only HEAD~1 infra/modules | xargs -r dirname | sed 's#^infra\/modules/\([^/]*\).*#\1#' | uniq | jq -R -c . | jq -s -c .)
          echo Modules that have changed: $folders_list
          echo "modules=$folders_list" >> $GITHUB_OUTPUT
    outputs:
      modules: ${{ steps.get-modules.outputs.modules }}

  push-modified-modules:
    runs-on: ubuntu-latest
    needs: get-modified-modules
    strategy:
      matrix:
        module: ${{ fromJSON(needs.get-modified-modules.outputs.modules) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
            # Extract the version from package.json
      - name: Extract version from package.json
        id: get_version
        run: |
          version=$(jq -r '.version' package.json)
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Setup git for subtree
        shell: bash
        run: |
          # Fix dubious ownership
          git config --global --add safe.directory /github/workspace
  
          # Set git email and name
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
  
          # Configure Git for authentication
          git config --global url."https://api:${{ secrets.SPLIT_MODULES_GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --unset http."https://github.com/".extraheader
      - name: Push Subtree to Module Repo
        env:
          MODULE_NAME: ${{ matrix.module }}
          MODULE_VERSION: ${{ steps.get_version.outputs.module_version }}
          REPO_URL: https://github.com/${{ github.repository_owner }}/terraform-azurerm-${{ matrix.module }}.git
        run: |
          git remote add module-repo "$REPO_URL"

          # Estrai la cronologia completa del modulo
          git subtree split --prefix=infra/modules/${MODULE_NAME} -b ${MODULE_NAME}-branch

          # Controlla se il branch esiste già nel repository di destinazione
          git fetch module-repo main --tags

          # Unisci le modifiche senza sovrascrivere la cronologia
          git checkout -b temp-branch module-repo/main
          git merge --allow-unrelated-histories ${MODULE_NAME}-branch
          
          # Define the tag name
          echo $PWD
          echo $(ls)
          TAG_NAME=$(jq -r '.version' infra/modules/${MODULE_NAME}/package.json)

          # Check if the tag exists on the remote
          if git ls-remote --tags module-repo | grep "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists on the remote."
          else
            echo "Tag $TAG_NAME does not exist on the remote. Creating and pushing the tag..."
            # Create the tag locally
            git tag "$TAG_NAME"
            # Push the tag to the remote
            git push module-repo "$TAG_NAME"
          fi

          # Pusha le modifiche senza forzare
          git push module-repo temp-branch:main --tags

          # Push all tags
          # git tag -l "module-${MODULE_NAME}-v*" | xargs -I {} git push module-repo {}:{}

          # Clean the temporary branch
          git branch -D ${MODULE_NAME}-branch
