name: Split and Push Changes

on:
  push:
    branches:
      - main
    paths:
      - "modules/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
      
jobs:
  get-modified-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            fetch-depth: 2 # Ensure we have enough history for the diff

      - name: Get modified modules
        id: get-modules
        run: |
          folders_list=$(git diff --no-commit-id --name-only HEAD~1 modules | xargs -r dirname | uniq | sed 's#^modules/##' | jq -R -c . | jq -s -c .)
          echo Modules that have changed: $folders_list
          echo "modules=$folders_list" >> $GITHUB_OUTPUT
    outputs:
      modules: ${{ steps.get-modules.outputs.modules }}

  push-modified-modules:
    runs-on: ubuntu-latest
    needs: get-modified-modules
    strategy:
      matrix:
        module: ${{ fromJSON(needs.get-modified-modules.outputs.modules) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if module repository exists and create if needed
        uses: actions/github-script@v6
        id: check-repo
        with:
          github-token: ${{ secrets.SPLIT_MODULES_GH_TOKEN }}
          script: |
            const repoName = `terraform-aws-${{ matrix.module }}`;
            const org = 'christian-calabrese';

            // Check if the repository exists
            try {
              const repo = await github.rest.repos.get({
                owner: org,
                repo: repoName
              });
              console.log(`Repository ${repoName} exists.`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`Repository ${repoName} does not exist. Creating it now.`);
                
                // Create the repository
                await github.rest.repos.createInOrg({
                  org,
                  name: repoName,
                  private: true
                });
                console.log(`Repository ${repoName} created.`);
              } else {
                throw error;
              }
            }
  
      - name: Push module to subrepository
        id: push-to-subrepository
        uses: ./.github/actions/splitsh
        with:
          repo: christian-calabrese/terraform-aws-${{ matrix.module }}
          prefix: "modules/${{ matrix.module }}"
          module: ${{ matrix.module }}
          github_pat: ${{ secrets.SPLIT_MODULES_GH_TOKEN }}
